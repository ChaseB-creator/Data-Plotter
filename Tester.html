<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Data Plotter</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="page">
    <h1>Interactive Data Plotter</h1>
    <p>Enter your data as comma-separated values, then click <strong>Generate graph</strong>.</p>

    <form id="plot-form">
      <label for="x_values">X values (comma-separated):</label>
      <textarea id="x_values" name="x_values" rows="2">1, 2, 3, 4, 5</textarea>

      <label for="y_values">Y values (comma-separated):</label>
      <textarea id="y_values" name="y_values" rows="2">2, 4, 1, 3, 5</textarea>

      <label for="title">Graph title:</label>
      <input id="title" name="title" type="text" value="My Data Plot" />

      <label for="chart_type">Plot type:</label>
      <select id="chart_type" name="chart_type">
        <option value="line">Line</option>
        <option value="bar">Bar</option>
        <option value="scatter">Scatter</option>
      </select>

      <label for="x_label">X-axis label:</label>
      <input id="x_label" name="x_label" type="text" value="X values" />

      <label for="y_label">Y-axis label:</label>
      <input id="y_label" name="y_label" type="text" value="Y values" />

      <div class="buttons">
        <button type="button" class="primary" onclick="generateGraph()">Generate graph</button>
        <button type="button" class="secondary" onclick="resetForm()">Reset</button>
      </div>
    </form>

    <div id="error-container" class="error hidden"></div>
    <div id="success-container" class="success hidden"></div>

    <div class="plot-card">
      <canvas id="plotCanvas"></canvas>
    </div>
  </div>

  <script>
    function parseCSVNumbers(rawValue) {
      if (!rawValue) return [];
      const text = rawValue.replace(/\n/g, ',').trim();
      const values = text.split(',').map(item => item.trim()).filter(item => item);
      const numbers = [];
      for (const item of values) {
        const num = parseFloat(item);
        if (isNaN(num)) {
          throw new Error(`Invalid number: '${item}'`);
        }
        numbers.push(num);
      }
      return numbers;
    }

    function showError(message) {
      const container = document.getElementById('error-container');
      container.textContent = message;
      container.classList.remove('hidden');
      document.getElementById('success-container').classList.add('hidden');
    }

    function hideError() {
      document.getElementById('error-container').classList.add('hidden');
    }

    function buildDataset(type, x, y, title) {
      if (type === 'scatter') {
        return {
          datasets: [{
            label: title,
            data: x.map((value, index) => ({ x: value, y: y[index] })),
            backgroundColor: 'rgba(37, 99, 235, 0.7)',
            borderColor: 'rgba(37, 99, 235, 1)',
            pointRadius: 6,
          }],
        };
      }

      return {
        labels: x,
        datasets: [{
          label: title,
          data: y,
          backgroundColor: type === 'bar' ? 'rgba(37, 99, 235, 0.6)' : 'rgba(37, 99, 235, 0.15)',
          borderColor: 'rgba(37, 99, 235, 1)',
          borderWidth: 2,
          fill: type === 'line',
          tension: 0.2,
        }],
      };
    }

    function buildOptions(type, xLabel, yLabel, title) {
      return {
        responsive: true,
        plugins: {
          legend: { position: 'top' },
          title: { display: true, text: title },
        },
        scales: {
          x: {
            title: { display: true, text: xLabel },
          },
          y: {
            title: { display: true, text: yLabel },
            beginAtZero: true,
          },
        },
      };
    }

    function generateGraph() {
      hideError();

      const xRaw = document.getElementById('x_values').value;
      const yRaw = document.getElementById('y_values').value;
      const title = document.getElementById('title').value || 'My Data Plot';
      const chartType = document.getElementById('chart_type').value;
      const xLabel = document.getElementById('x_label').value || 'X values';
      const yLabel = document.getElementById('y_label').value || 'Y values';

      let xValues, yValues;
      try {
        xValues = parseCSVNumbers(xRaw);
        yValues = parseCSVNumbers(yRaw);
      } catch (err) {
        showError(err.message);
        return;
      }

      if (xValues.length === 0 || yValues.length === 0) {
        showError('Please enter at least one value for both X and Y.');
        return;
      }

      if (xValues.length !== yValues.length) {
        showError('X values and Y values must contain the same number of entries.');
        return;
      }

      const ctx = document.getElementById('plotCanvas').getContext('2d');
      const config = {
        type: chartType === 'scatter' ? 'scatter' : chartType,
        data: buildDataset(chartType, xValues, yValues, title),
        options: buildOptions(chartType, xLabel, yLabel, title),
      };

      if (window.plotChart) {
        window.plotChart.destroy();
      }

      window.plotChart = new Chart(ctx, config);
    }

    function resetForm() {
      document.getElementById('plot-form').reset();
      hideError();
      if (window.plotChart) {
        window.plotChart.destroy();
      }
    }

    // Generate initial chart on page load
    window.addEventListener('load', generateGraph);
  </script>
</body>
</html>
